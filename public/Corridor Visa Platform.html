document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px 2px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.45)}\n*{box-sizing:border-box}\nbody{margin:0;background:#F4F5F8;-webkit-font-smoothing:antialiased}\na{color:var(--accent,#2F4BFF);text-decoration:none}\na:hover{color:var(--ink,#0B1120)}\ninput,button,select,textarea{font:inherit;color:inherit}\ninput:focus,select:focus{outline:2px solid var(--accent,#2F4BFF);outline-offset:1px}\n@keyframes sweep{0%{transform:translateY(-30%)}100%{transform:translateY(330%)}}\n@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}\n@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}\n@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"--accent: {{ accentVar }}; min-height:100vh; background:var(--bg,#F4F5F8); color:var(--ink,#0B1120); font-family:Manrope,'Helvetica Neue',Helvetica,sans-serif; font-size:15px; line-height:1.5; font-feature-settings:'tnum' 1;\">\n\n  <header style=\"position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:22px; padding:0 26px; height:64px; background:var(--surface,#fff); border-bottom:1px solid var(--line,#E3E7EE);\">\n    <div style=\"display:flex; align-items:center; gap:9px; cursor:pointer;\" sc-camel-on-click=\"{{ goHome }}\">\n      <div style=\"width:11px; height:11px; border-radius:3px; background:var(--accent,#2F4BFF);\"><\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16.5px; letter-spacing:-0.02em;\">Corridor<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex; align-items:center; gap:20px; font-size:13.5px; font-weight:600; color:var(--ink2,#59637A);\">\n      <span style=\"cursor:pointer;\" sc-camel-on-click=\"{{ goHome }}\" style-hover=\"color:var(--ink,#0B1120)\">Destinations<\u002Fspan>\n      <span style=\"cursor:pointer;\" sc-camel-on-click=\"{{ goStatus }}\" style-hover=\"color:var(--ink,#0B1120)\">Track<\u002Fspan>\n      <span style=\"cursor:pointer;\" sc-camel-on-click=\"{{ goVault }}\" style-hover=\"color:var(--ink,#0B1120)\">Vault<\u002Fspan>\n    <\u002Fnav>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <sc-if value=\"{{ inFlow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; background:var(--ok-soft,#E6F6EF); color:var(--ok,#0E9F6E); font-size:12.5px; font-weight:700;\">\n        <div style=\"width:6px; height:6px; border-radius:50%; background:currentColor;\"><\u002Fdiv>\n        Saved\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); color:var(--ink2,#59637A); cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">\n      <div style=\"width:13px; height:13px; border-radius:50%; border:2px solid currentColor; background:linear-gradient(90deg,currentColor 50%,transparent 50%);\"><\u002Fdiv>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"padding:9px 15px; border-radius:10px; border:none; background:var(--ink,#0B1120); color:var(--bg,#F4F5F8); font-size:13.5px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.2)\">Start an application<\u002Fbutton>\n  <\u002Fheader>\n\n  <!-- ════ HOME ════ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <section style=\"max-width:1200px; margin:0 auto; padding:56px 26px 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:44px; align-items:center;\">\n      <div style=\"min-width:0;\">\n        <div style=\"display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; background:var(--accent-soft,#ECEEFF); color:var(--accent,#2F4BFF); font-size:12.5px; font-weight:700;\">Indian passport · rules verified 24 Aug 2026<\u002Fdiv>\n        <h1 style=\"font-family:'Space Grotesk',sans-serif; font-size:clamp(36px,4.6vw,58px); line-height:1.02; letter-spacing:-0.038em; font-weight:700; margin:20px 0 14px; text-wrap:balance;\">Know the fee, the date, and your odds — before you start.<\u002Fh1>\n        <p style=\"margin:0 0 28px; color:var(--ink2,#59637A); font-size:17px; max-width:48ch; text-wrap:pretty;\">Pick a destination and read the real requirements first. Then apply in one guided pass — scan once, drop your documents in a pile, and we sort them.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n          <button sc-camel-on-click=\"{{ scrollDest }}\" style=\"padding:14px 22px; border-radius:12px; border:none; background:var(--accent,#2F4BFF); color:var(--on-accent,#fff); font-size:15px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">Browse destinations<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goStatus }}\" style=\"padding:14px 22px; border-radius:12px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:15px; font-weight:700; cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">Track an application<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; aspect-ratio:4/3; min-width:0; border-radius:22px; overflow:hidden; box-shadow:var(--shadow,0 10px 30px rgba(11,17,32,.07));\">\n        <image-slot id=\"hero-main\" shape=\"rect\" placeholder=\"Hero — traveller at a departure gate, desaturated\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1200px; margin:0 auto; padding:44px 26px 8px;\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px;\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"padding:20px; border-radius:16px; background:var(--surface,#fff); border:1px solid var(--line,#E3E7EE);\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-size:27px; font-weight:700; letter-spacing:-0.035em;\">{{ s.v }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--ink2,#59637A); margin-top:3px; text-wrap:pretty;\">{{ s.k }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"destinations\" style=\"max-width:1200px; margin:0 auto; padding:44px 26px 0;\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px;\">\n        <div>\n          <h2 style=\"font-family:'Space Grotesk',sans-serif; font-size:30px; letter-spacing:-0.032em; margin:0 0 6px;\">Where are you going?<\u002Fh2>\n          <p style=\"margin:0; color:var(--ink2,#59637A);\">Open a country to see its visa types, the exact checklist, and how long it really takes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:7px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ regionTabs }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ r.go }}\" style=\"padding:8px 14px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:700; background:{{ r.bg }}; color:{{ r.fg }}; border:1px solid {{ r.bc }};\">{{ r.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:16px;\">\n        <sc-for list=\"{{ destList }}\" as=\"d\" hint-placeholder-count=\"9\">\n          <div sc-camel-on-click=\"{{ d.open }}\" style=\"cursor:pointer; border-radius:18px; overflow:hidden; background:var(--surface,#fff); border:1px solid var(--line,#E3E7EE); transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s;\" style-hover=\"transform:translateY(-3px); box-shadow:0 14px 34px rgba(11,17,32,.12 =\"{{ atPeople }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:0 4px;\">\n            <div>\n              <h2 style=\"font-family:'Space Grotesk',sans-serif; font-size:24px; letter-spacing:-0.028em; margin:0 0 5px;\">Who's travelling?<\u002Fh2>\n              <p style=\"margin:0; color:var(--ink2,#59637A); font-size:14px;\">Passport and photo for each person. Scanning takes ten seconds and fills the form for you.<\u002Fp>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addPax }}\" style=\"padding:10px 15px; border-radius:10px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">+ Add traveller<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ paxCards }}\" as=\"p\" hint-placeholder-count=\"1\">\n            <div style=\"padding:20px; border-radius:18px; background:var(--surface,#fff); border:1.5px solid {{ p.bc }}; box-shadow:var(--shadow,0 10px 30px rgba(11,17,32,.07));\">\n              <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\">\n                <div style=\"display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:9px; background:{{ p.badgeBg }}; color:{{ p.badgeFg }}; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700;\">{{ p.mark }}<\u002Fdiv>\n                <div style=\"flex:1; min-width:0;\">\n                  <div style=\"font-size:16px; font-weight:700; letter-spacing:-0.018em;\">{{ p.title }}<\u002Fdiv>\n                  <div style=\"font-size:13px; color:var(--ink2,#59637A);\">{{ p.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ p.remove }}\" style=\"padding:7px 12px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:transparent; font-size:12.5px; font-weight:700; color:var(--ink2,#59637A); cursor:pointer;\" style-hover=\"color:var(--danger,#DC2626)\">Remove<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px;\">\n                <div style=\"padding:16px; border-radius:14px; border:1.5px solid {{ p.pp.bc }}; background:{{ p.pp.bg }};\">\n                  <div style=\"display:flex; align-items:center; gap:9px;\">\n                    <div style=\"width:22px; height:22px; border-radius:6px; background:{{ p.pp.iconBg }}; color:{{ p.pp.iconFg }}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;\">{{ p.pp.mark }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:700;\">Passport<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:8px; font-size:12.5px; color:{{ p.pp.noteFg }}; text-wrap:pretty;\">{{ p.pp.note }}<\u002Fdiv>\n                  <sc-if value=\"{{ p.pp.showBtns }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; gap:8px; margin-top:12px;\">\n                      <button sc-camel-on-click=\"{{ p.pp.scan }}\" style=\"flex:1; padding:9px; border-radius:9px; border:none; background:var(--accent,#2F4BFF); color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">Scan<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ p.pp.upload }}\" style=\"flex:1; padding:9px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">Upload<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ p.pp.done }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ p.toggleFields }}\" style=\"width:100%; margin-top:12px; padding:9px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">{{ p.fieldsLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"padding:16px; border-radius:14px; border:1.5px solid {{ p.ph.bc }}; background:{{ p.ph.bg }};\">\n                  <div style=\"display:flex; align-items:center; gap:9px;\">\n                    <div style=\"width:22px; height:22px; border-radius:6px; background:{{ p.ph.iconBg }}; color:{{ p.ph.iconFg }}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;\">{{ p.ph.mark }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:700;\">Photograph<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:8px; font-size:12.5px; color:{{ p.ph.noteFg }}; text-wrap:pretty;\">{{ p.ph.note }}<\u002Fdiv>\n                  <sc-if value=\"{{ p.ph.showBtns }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; gap:8px; margin-top:12px;\">\n                      <button sc-camel-on-click=\"{{ p.ph.capture }}\" style=\"flex:1; padding:9px; border-radius:9px; border:none; background:var(--accent,#2F4BFF); color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">Take photo<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ p.ph.upload }}\" style=\"flex:1; padding:9px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:12.5px; font-weight:700; cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">Upload<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ p.ph.retake }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ p.ph.capture }}\" style=\"width:100%; margin-top:12px; padding:9px; border-radius:9px; border:none; background:var(--warn,#B45309); color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;\">Retake<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ p.showFields }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px; padding-top:16px; border-top:1px solid var(--line,#E3E7EE);\">\n                <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:14px; padding:9px 12px; border-radius:10px; background:var(--ok-soft,#E6F6EF);\">\n                  <div style=\"width:14px; height:14px; border-radius:50%; background:var(--ok,#0E9F6E);\"><\u002Fdiv>\n                  <div style=\"font-size:12.5px; font-weight:700; color:var(--ok,#0E9F6E);\">Read from the passport. Nothing is final until you review — change anything that looks off.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:13px;\">\n                  <sc-for list=\"{{ p.fields }}\" as=\"fl\" hint-placeholder-count=\"6\">\n                    <label style=\"display:flex; flex-direction:column; gap:5px; min-width:0;\">\n                      <div style=\"display:flex; align-items:center; gap:7px;\">\n                        <span style=\"font-size:12px; font-weight:700; color:var(--ink2,#59637A);\">{{ fl.label }}<\u002Fspan>\n                        <sc-if value=\"{{ fl.auto }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px; font-weight:700; letter-spacing:0.04em; padding:2px 5px; border-radius:5px; background:var(--accent-soft,#ECEEFF); color:var(--accent,#2F4BFF);\">AUTO<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <input type=\"text\" sc-camel-default-value=\"{{ fl.value }}\" sc-camel-on-change=\"{{ fl.onChange }}\" style=\"width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:14px; font-weight:600; font-family:'Space Grotesk',sans-serif;\">\n                      <div style=\"font-size:11.5px; color:var(--ink3,#8A93A6); text-wrap:pretty;\">{{ fl.hint }}<\u002Fdiv>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Stage 1 · Trip -->\n        <sc-if value=\"{{ atTrip }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:26px; border-radius:18px; background:var(--surface,#fff); border:1px solid var(--line,#E3E7EE); box-shadow:var(--shadow,0 10px 30px rgba(11,17,32,.07)); display:flex; flex-direction:column; gap:22px;\">\n          <div>\n            <h2 style=\"font-family:'Space Grotesk',sans-serif; font-size:24px; letter-spacing:-0.028em; margin:0 0 5px;\">The trip<\u002Fh2>\n            <p style=\"margin:0; color:var(--ink2,#59637A); font-size:14px;\">One question at a time. The next appears once this one's answered.<\u002Fp>\n          <\u002Fdiv>\n          <label style=\"display:flex; flex-direction:column; gap:7px;\">\n            <span style=\"font-size:12.5px; font-weight:700; color:var(--ink2,#59637A);\">Arrival date<\u002Fspan>\n            <input type=\"date\" sc-camel-default-value=\"{{ arrival }}\" sc-camel-on-change=\"{{ setArrival }}\" style=\"max-width:260px; padding:12px 13px; border-radius:10px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:14.5px; font-weight:600; font-family:'Space Grotesk',sans-serif;\">\n          <\u002Flabel>\n          <sc-if value=\"{{ hasArrival }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; animation:rise .3s ease both;\">\n            <span style=\"font-size:12.5px; font-weight:700; color:var(--ink2,#59637A);\">How many nights?<\u002Fspan>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n              <sc-for list=\"{{ nightOpts }}\" as=\"n\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ n.go }}\" style=\"padding:10px 16px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700; font-family:'Space Grotesk',sans-serif; background:{{ n.bg }}; color:{{ n.fg }}; border:1.5px solid {{ n.bc }};\">{{ n.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasNights }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; animation:rise .3s ease both;\">\n            <span style=\"font-size:12.5px; font-weight:700; color:var(--ink2,#59637A);\">What's the purpose?<\u002Fspan>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n              <sc-for list=\"{{ purposeOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ o.go }}\" style=\"padding:10px 16px; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700; background:{{ o.bg }}; color:{{ o.fg }}; border:1.5px solid {{ o.bc }};\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasPurpose }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"display:flex; flex-direction:column; gap:7px; animation:rise .3s ease both;\">\n            <span style=\"font-size:12.5px; font-weight:700; color:var(--ink2,#59637A);\">Where are you staying the first night?<\u002Fspan>\n            <input type=\"text\" placeholder=\"Hotel name or full address\" sc-camel-default-value=\"{{ stay }}\" sc-camel-on-change=\"{{ setStay }}\" style=\"padding:12px 13px; border-radius:10px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:14.5px; font-weight:600;\">\n            <div style=\"font-size:12px; color:var(--ink3,#8A93A6);\">Copy it exactly off your booking — we match this against the accommodation document so the consulate never sees a mismatch.<\u002Fdiv>\n          <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasStay }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:12px; background:var(--ok-soft,#E6F6EF); color:var(--ok,#0E9F6E); font-size:13.5px; font-weight:700; animation:pop .35s ease both;\">\n            <div style=\"width:16px; height:16px; border-radius:50%; background:currentColor;\"><\u002Fdiv>\n            Trip details done. Only documents left.\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Stage 2 · Documents -->\n        <sc-if value=\"{{ atDocs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:0 4px;\">\n            <div>\n              <h2 style=\"font-family:'Space Grotesk',sans-serif; font-size:24px; letter-spacing:-0.028em; margin:0 0 5px;\">Documents<\u002Fh2>\n              <p style=\"margin:0; color:var(--ink2,#59637A); font-size:14px;\">Drop everything in one go. We read each file and file it against the checklist.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; white-space:nowrap;\">{{ docCount }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:28px; border-radius:18px; border:2px dashed {{ dropBc }}; background:{{ dropBg }}; text-align:center; transition:border-color .2s;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; letter-spacing:-0.022em;\">Drop the whole pile here<\u002Fdiv>\n            <p style=\"margin:7px auto 16px; max-width:46ch; font-size:13.5px; color:var(--ink2,#59637A); text-wrap:pretty;\">Statements, tickets, letters, screenshots — for everyone at once, in any order. We identify each one and slot it into the right place. Anything we can't read goes into a tray for you to map in a tap.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:9px; justify-content:center;\">\n              <button sc-camel-on-click=\"{{ dropFiles }}\" style=\"padding:12px 20px; border-radius:11px; border:none; background:var(--accent,#2F4BFF); color:#fff; font-size:14px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">{{ dropLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ dropFiles }}\" style=\"padding:12px 20px; border-radius:11px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:14px; font-weight:700; cursor:pointer;\" style-hover=\"border-color:var(--ink3,#8A93A6)\">Import from Drive<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px; font-size:12px; color:var(--ink3,#8A93A6);\">PDF, JPG, PNG or HEIC · up to 15 MB each · encrypted the moment they leave your device<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasSorting }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px; border-radius:16px; background:var(--surface,#fff); border:1px solid var(--line,#E3E7EE);\">\n            <div style=\"font-size:13px; font-weight:700; color:var(--ink2,#59637A); margin-bottom:12px;\">{{ sortingLabel }}<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:8px;\">\n              <sc-for list=\"{{ fileTray }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:11px; background:var(--surface2,#EFF1F5);\">\n                  <div style=\"width:22px; height:22px; border-radius:6px; flex:0 0 22px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:{{ f.iconBg }}; color:{{ f.iconFg }}; animation:{{ f.anim }};\">{{ f.mark }}<\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; font-size:13px; font-weight:600; font-family:'Space Grotesk',sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ f.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px; font-weight:700; color:{{ f.statusFg }}; white-space:nowrap;\">{{ f.status }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasUnmatched }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px; border-radius:16px; background:var(--warn-soft,#FDF3DC); border:1.5px solid var(--warn,#B45309);\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; color:var(--warn,#B45309); margin-bottom:4px;\">{{ unmatchedTitle }}<\u002Fdiv>\n            <p style=\"margin:0 0 14px; font-size:13px; color:var(--ink,#0B1120);\">We couldn't read this one well enough to be sure. Pick where it belongs — that's the whole job.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-for list=\"{{ unmatched }}\" as=\"u\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--surface,#fff);\">\n                  <div style=\"flex:1 1 180px; min-width:0; font-size:13px; font-weight:700; font-family:'Space Grotesk',sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ u.name }}<\u002Fdiv>\n                  <sc-raw-select sc-camel-on-change=\"{{ u.map }}\" style=\"flex:0 1 240px; padding:9px 11px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:var(--surface,#fff); font-size:13px; font-weight:600; cursor:pointer;\">\n                    <option value=\"\">Choose what this is…<\u002Foption>\n                    <sc-for list=\"{{ mapOptions }}\" as=\"m\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <button sc-camel-on-click=\"{{ u.discard }}\" style=\"padding:9px 12px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:transparent; font-size:12.5px; font-weight:700; color:var(--ink2,#59637A); cursor:pointer;\">Not needed<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ docGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; flex-direction:column; gap:9px;\">\n              <div style=\"display:flex; align-items:center; gap:10px; padding:4px 4px 0;\">\n                <div style=\"font-size:12px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink3,#8A93A6);\">{{ g.title }}<\u002Fdiv>\n                <div style=\"flex:1; height:1px; background:var(--line,#E3E7EE);\"><\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:700; color:var(--ink2,#59637A);\">{{ g.count }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"padding:16px 18px; border-radius:14px; background:var(--surface,#fff); border:1.5px solid {{ d.bc }}; transition:border-color .3s;\">\n                  <div style=\"display:flex; align-items:center; gap:14px;\">\n                    <div style=\"display:flex; align-items:center; justify-content:center; flex:0 0 30px; width:30px; height:30px; border-radius:9px; background:{{ d.iconBg }}; color:{{ d.iconFg }}; font-size:13px; font-weight:800; animation:{{ d.anim }};\">{{ d.mark }}<\u002Fdiv>\n                    <div style=\"flex:1; min-width:0;\">\n                      <div style=\"font-size:14.5px; font-weight:700; letter-spacing:-0.012em;\">{{ d.n }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px; color:{{ d.noteFg }}; text-wrap:pretty;\">{{ d.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ d.tip }}\" style=\"flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--line,#E3E7EE); background:transparent; font-size:12px; font-weight:800; color:var(--ink2,#59637A); cursor:pointer;\" style-hover=\"border-color:var(--accent,#2F4BFF); color:var(--accent,#2F4BFF)\">?<\u002Fbutton>\n                    <sc-if value=\"{{ d.showBtn }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ d.action }}\" style=\"flex:0 0 auto; padding:9px 15px; border-radius:10px; border:none; background:{{ d.btnBg }}; color:#fff; font-size:13px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">{{ d.btn }}<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ d.tipOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:13px; padding:14px 16px; border-radius:12px; background:var(--surface2,#EFF1F5); animation:rise .25s ease both;\">\n                    <div style=\"font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink3,#8A9 0 30)\" stroke-dasharray=\"157\" stroke-dashoffset=\"{{ statusRingOffset }}\" style=\"transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.25,1);\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; max-width:11ch; line-height:1.25;\">{{ statusStageName }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isQuery }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:22px; border-radius:18px; background:var(--warn-soft,#FDF3DC); border:1.5px solid var(--warn,#B45309); margin-bottom:18px;\">\n      <div style=\"font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:var(--warn,#B45309); margin-bottom:6px;\">The consulate asked for one more thing<\u002Fdiv>\n      <p style=\"margin:0 0 14px; font-size:14px; text-wrap:pretty;\">They want a bank statement covering June as well — yours starts in July. Routine, and it doesn't affect the decision. Send it today and your date holds.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n        <button sc-camel-on-click=\"{{ resolveQuery }}\" style=\"padding:12px 18px; border-radius:11px; border:none; background:var(--warn,#B45309); color:#fff; font-size:14px; font-weight:700; cursor:pointer;\">Upload the statement<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resolveQuery }}\" style=\"padding:12px 18px; border-radius:11px; border:1px solid var(--warn,#B45309); background:transparent; color:var(--warn,#B45309); font-size:14px; font-weight:700; cursor:pointer;\">Talk to a case handler<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:26px; border-radius:20px; background:var(--surface,#fff); border:1px solid var(--line,#E3E7EE);\">\n      <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; gap:16px;\">\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:0 0 22px;\">\n            <div style=\"width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:{{ t.dotBg }}; color:{{ t.dotFg }}; border:2px solid {{ t.dotBc }}; animation:{{ t.anim }};\">{{ t.mark }}<\u002Fdiv>\n            <div style=\"flex:1; width:2px; background:{{ t.lineBg }}; min-height:{{ t.lineH }};\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-bottom:22px; min-width:0;\">\n            <div style=\"font-size:15px; font-weight:700; letter-spacing:-0.015em; color:{{ t.fg }};\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--ink2,#59637A); text-wrap:pretty;\">{{ t.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;\">\n      <sc-for list=\"{{ statusActions }}\" as=\"a\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ a.go }}\" style=\"padding:12px 17px; border-radius:11px; cursor:pointer; font-size:13.5px; font-weight:700; background:{{ a.bg }}; color:{{ a.fg }}; border:1px solid {{ a.bc }};\" style-hover=\"filter:brightness(1.06)\">{{ a.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:13px; font-size:12.5px; color:var(--ink3,#8A93A6);\">These buttons simulate consulate events so you can walk the whole state machine.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ════ VAULT ════ -->\n  <sc-if value=\"{{ isVault }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:900px; margin:0 auto; padding:44px 26px 96px;\">\n    <h2 style=\"font-family:'Space Grotesk',sans-serif; font-size:30px; letter-spacing:-0.032em; margin:0 0 6px;\">Your vault<\u002Fh2>\n    <p style=\"margin:0 0 26px; color:var(--ink2,#59637A);\">Every visa, passport scan and supporting file you've given us — yours to re-download or share, and reused automatically on your next application.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;\">\n      <sc-for list=\"{{ vaultItems }}\" as=\"v\" hint-placeholder-count=\"4\">\n        <div style=\"padding:20px; border-radius:16px; background:{{ v.bg }}; color:{{ v.fg }}; border:1px solid var(--line,#E3E7EE); display:flex; flex-direction:column; gap:14px; min-height:172px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:0.06em; padding:4px 7px; border-radius:6px; background:{{ v.chipBg }}; color:{{ v.chipFg }};\">{{ v.code }}<\u002Fdiv>\n            <div style=\"font-size:11.5px; font-weight:700; opacity:.6;\">{{ v.status }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.025em;\">{{ v.title }}<\u002Fdiv>\n            <div style=\"font-size:13px; opacity:.68; margin-top:3px;\">{{ v.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px;\">\n            <div style=\"padding:8px 13px; border-radius:9px; background:{{ v.btnBg }}; color:{{ v.btnFg }}; font-size:12.5px; font-weight:700; cursor:pointer;\">Download<\u002Fdiv>\n            <div style=\"padding:8px 13px; border-radius:9px; border:1px solid {{ v.btnBc }}; font-size:12.5px; font-weight:700; cursor:pointer;\">Share<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ════ CAPTURE OVERLAY ════ -->\n  <sc-if value=\"{{ captureOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(6,9,15,.72); backdrop-filter:blur(8px);\">\n    <div style=\"width:100%; max-width:620px; border-radius:22px; overflow:hidden; background:var(--surface,#fff); box-shadow:0 30px 80px rgba(0,0,0,.4); animation:pop .28s cubic-bezier(.2,.9,.3,1) both;\">\n      <div style=\"padding:22px 24px 0;\">\n        <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px;\">\n          <div>\n            <h3 style=\"font-family:'Space Grotesk',sans-serif; font-size:21px; letter-spacing:-0.025em; margin:0 0 5px;\">{{ captureTitle }}<\u002Fh3>\n            <p style=\"margin:0; font-size:13.5px; color:var(--ink2,#59637A);\">{{ captureSub }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeCapture }}\" style=\"flex:0 0 auto; width:32px; height:32px; border-radius:9px; border:1px solid var(--line,#E3E7EE); background:transparent; font-size:15px; font-weight:700; color:var(--ink2,#59637A); cursor:pointer;\">×<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin:18px 24px 0; position:relative; aspect-ratio:{{ captureRatio }}; border-radius:16px; overflow:hidden; background:#0B1120; display:flex; align-items:center; justify-content:center;\">\n        <div style=\"position:absolute; inset:{{ captureInset }}; border-radius:{{ captureGuideRadius }}; border:2px solid rgba(255,255,255,.85);\"><\u002Fdiv>\n        <sc-if value=\"{{ captureBusy }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; left:8%; right:8%; height:3px; background:var(--accent,#2F4BFF); box-shadow:0 0 24px 7px var(--accent,#2F4BFF); animation:sweep 1.1s cubic-bezier(.5,0,.5,1) infinite;\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"position:relative; z-index:2; padding:8px 14px; border-radius:9px; background:rgba(255,255,255,.92); color:#0B1120; font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700;\">{{ captureStatus }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:18px 24px 0; display:flex; flex-direction:column; gap:8px;\">\n        <sc-for list=\"{{ captureTips }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; gap:10px; align-items:flex-start;\">\n            <div style=\"flex:0 0 6px; width:6px; height:6px; border-radius:50%; margin-top:7px; background:var(--accent,#2F4BFF);\"><\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--ink2,#59637A); text-wrap:pretty;\">{{ t }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:20px 24px 24px; display:flex; gap:10px;\">\n        <button sc-camel-on-click=\"{{ doCapture }}\" style=\"flex:1; padding:14px; border-radius:12px; border:none; background:var(--accent,#2F4BFF); color:#fff; font-size:15px; font-weight:700; cursor:pointer;\" style-hover=\"filter:brightness(1.08)\">{{ captureCta }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ closeCapture }}\" style=\"padding:14px 18px; border-radius:12px; border:1px solid var(--line,#E3E7EE); background:transparent; font-size:14px; font-weight:700; cursor:pointer;\">Cancel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ════ MOMENTUM MOMENT ════ -->\n  <sc-if value=\"{{ celebrate }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; left:0; right:0; bottom:26px; z-index:95; display:flex; justify-content:center; pointer-events:none; padding:0 20px;\">\n    <div style=\"display:flex; align-items:center; gap:16px; padding:16px 22px; border-radius:16px; background:var(--ink,#0B1120); color:#F4F5F8; box-shadow:0 20px 50px rgba(0,0,0,.35); animation:pop .32s cubic-bezier(.2,.9,.3,1) both;\">\n      <svg width=\"42\" height=\"42\" sc-camel-view-box=\"0 0 60 60\" style=\"flex:0 0 42px;\">\n        <circle cx=\"30\" cy=\"30\" r=\"25\" fill=\"none\" stroke=\"rgba(255,255,255,.18)\" stroke-width=\"7\"><\u002Fcircle>\n        <circle cx=\"30\" cy=\"30\" r=\"25\" fill=\"none\" stroke=\"var(--accent,#2F4BFF)\" stroke-width=\"7\" stroke-linecap=\"round\" transform=\"rotate(-90 30 30)\" stroke-dasharray=\"157\" stroke-dashoffset=\"{{ ringOffset }}\" style=\"transition:stroke-dashoffset .7s cubic-bezier(.2,.9,.25,1);\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; letter-spacing:-0.02em;\">{{ celebrateTitle }}<\u002Fdiv>\n        <div style=\"font-size:13px; opacity:.66;\">{{ celebrateSub }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2F4BFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2F4BFF&quot;,&quot;#0F766E&quot;,&quot;#7C3AED&quot;,&quot;#E0533D&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Light&quot;,&quot;options&quot;:[&quot;Light&quot;,&quot;Dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Two-pane&quot;,&quot;options&quot;:[&quot;Two-pane&quot;,&quot;Single card&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flow&quot;},&quot;showOdds&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flow&quot;}}\">\nclass Component extends DCLogic {\n  DOCLIB = {\n    passport:{n:'Passport bio page',per:1,w:'Confirms who you are and that your passport stays valid at least six months past your return date.',s:'Colour scan of the photo page \\u00b7 all four corners visible \\u00b7 JPG or PDF under 5 MB'},\n    photo:{n:'Passport photograph',per:1,w:'The consulate matches this against your passport photo. A non-compliant photo is the single most common reason an application bounces.',s:'35 \\u00d7 45 mm \\u00b7 plain white background \\u00b7 no glasses or headwear \\u00b7 JPG, at least 600 \\u00d7 600 px'},\n    flight:{n:'Return or onward ticket',w:'Shows you intend to leave before the visa expires \\u2014 the thing consulates care about most.',s:'PDF or screenshot of the confirmed booking \\u00b7 the name must match the passport exactly'},\n    hotel:{n:'Where you\\u2019ll stay',w:'Proves you have somewhere to go on arrival. It has to cover at least your first night.',s:'Hotel confirmation, rental booking, or a host\\u2019s address with a copy of their ID'},\n    bank:{n:'Bank statement \\u00b7 last 3 months',w:'Shows you can fund the trip without working illegally. Steady, explainable activity matters more than a large balance.',s:'PDF straight from net banking, all pages, unedited \\u00b7 or a branch-stamped printout'},\n    itr:{n:'Income tax returns \\u00b7 last 2 years',w:'Backs the bank statement with a verifiable income history.',s:'ITR-V acknowledgement PDFs downloaded from the income tax portal'},\n    noc:{n:'Employment letter or NOC',w:'Ties you to home. Strong ties are the most powerful anti-overstay signal you can send.',s:'Company letterhead, signed, dated within 30 days \\u00b7 states your role, salary and approved leave'},\n    itinerary:{n:'Day-by-day itinerary',w:'Tells a coherent story about the trip. Vague plans invite questions.',s:'Simple day-wise list of cities and stays \\u00b7 PDF or DOC'},\n    insurance:{n:'Travel insurance \\u00b7 \\u20ac30,000 cover',w:'Mandatory across the Schengen area. Cover must run the full length of the stay.',s:'Policy PDF naming every traveller \\u00b7 minimum \\u20ac30,000 medical cover'},\n    sponsor:{n:'Sponsorship letter + sponsor\\u2019s ID',w:'Needed when someone else is paying. Without it, a thin account reads as a red flag.',s:'Signed letter plus the sponsor\\u2019s bank statement and passport or ID copy'},\n    invite:{n:'Invitation from the host company',w:'Explains the business purpose and who is responsible for you while you\\u2019re there.',s:'Host letterhead \\u00b7 states dates, purpose, and who bears costs'},\n    ds160:{n:'DS-160 confirmation page',per:1,w:'The US application form itself. Nothing moves until the barcode page exists.',s:'PDF with the barcode, one per traveller'},\n    gst:{n:'Business registration / GST certificate',w:'Confirms the company you say you run actually exists.',s:'Certificate PDF \\u00b7 any issue date'}\n  };\n  DEST = [\n    {code:'VNM',name:'Vietnam',region:'South-East Asia',shot:'Ha Long Bay at first light',note:'Your passport must have at least two blank pages and six months\\u2019 validity on the day you land.',visas:[\n      {id:'vn30',name:'Tourist e-Visa',tag:'30 days, single entry',gov:1750,service:899,days:3,rate:97,docs:['passport','photo','flight','hotel']},\n      {id:'vn90',name:'Tourist e-Visa',tag:'90 days, multiple entry',gov:4200,service:1199,days:4,rate:96,docs:['passport','photo','flight','hotel','bank']}]},\n    {code:'THA',name:'Thailand',region:'South-East Asia',shot:'Bangkok rooftops at dusk',note:'Thailand no longer stamps a paper visa \\u2014 you carry the approval on your phone and show it at immigration.',visas:[\n      {id:'th60',name:'Tourist e-Visa',tag:'60 days, single entry',gov:1400,service:899,days:2,rate:98,docs:['passport','photo','flight','hotel','bank']},\n      {id:'thdtv',name:'Destination Thailand Visa',tag:'180 days, remote work',gov:9800,service:2499,days:9,rate:88,docs:['passport','photo','bank','itr','noc','hotel']}]},\n    {code:'ARE',name:'UAE',region:'Middle East',shot:'Dubai skyline through haze',note:'Onward tickets are checked at check-in, not just at the border \\u2014 airlines have refused boarding without one.',visas:[\n      {id:'ae30',name:'Tourist visa',tag:'30 days, single entry',gov:5100,service:999,days:2,rate:99,docs:['passport','photo','flight','hotel']},\n      {id:'ae60',name:'Tourist visa',tag:'60 days, single entry',gov:8400,service:1199,days:3,rate:98,docs:['passport','photo','flight','hotel','bank']}]},\n    {code:'IDN',name:'Indonesia',region:'South-East Asia',shot:'Bali rice terraces, overcast',note:'e-VOA is only valid at 17 designated entry points \\u2014 check yours matches your flight.',visas:[\n      {id:'idvoa',name:'e-Visa on Arrival',tag:'30 days, extendable once',gov:3000,service:899,days:1,rate:99,docs:['passport','photo','flight']},\n      {id:'idb211',name:'B211A Visit Visa',tag:'60 days, single entry',gov:7200,service:1999,days:6,rate:95,docs:['passport','photo','flight','hotel','bank']}]},\n    {code:'SGP',name:'Singapore',region:'South-East Asia',shot:'Marina waterfront, long exposure',note:'Applications must be filed by an authorised local agent \\u2014 you cannot submit directly from India.',visas:[\n      {id:'sg30',name:'Tourist e-Visa',tag:'30 days, multiple entry',gov:2400,service:1199,days:4,rate:96,docs:['passport','photo','hotel','bank','noc']}]},\n    {code:'TUR',name:'T\\u00fcrkiye',region:'Europe',shot:'Istanbul rooftops and minarets',note:'Holders of a valid Schengen, UK or US visa qualify for a simpler route and a lower fee.',visas:[\n      {id:'tr30',name:'Tourist e-Visa',tag:'30 days, single entry',gov:2200,service:899,days:2,rate:98,docs:['passport','photo','hotel','flight']}]},\n    {code:'JPN',name:'Japan',region:'East Asia',shot:'Kyoto side street in rain',note:'Japan wants a day-by-day itinerary on their own form. We generate it from your answers.',visas:[\n      {id:'jp15',name:'Tourist visa',tag:'15 days, single entry',gov:1950,service:2499,days:7,rate:94,docs:['passport','photo','itinerary','bank','itr','noc']},\n      {id:'jpbiz',name:'Business visa',tag:'90 days, single entry',gov:1950,service:2999,days:8,rate:93,docs:['passport','photo','invite','noc','bank','gst']}]},\n    {code:'AUS',name:'Australia',region:'Oceania',shot:'Sydney harbour, muted tones',note:'Health checks are requested at random. If yours is, the clock pauses \\u2014 we tell you the same hour.',visas:[\n      {id:'au600',name:'Visitor visa 600',tag:'3 months, tourist stream',gov:8400,service:2499,days:6,rate:92,docs:['passport','photo','bank','itr','noc','itinerary']}]},\n    {code:'FRA',name:'Schengen',region:'Europe',shot:'Paris boulevard, grey morning',note:'You apply through the country where you spend the most nights \\u2014 not your first stop. We work that out for you.',visas:[\n      {id:'sc90',name:'Short-stay visa C',tag:'90 days in any 180',gov:7900,service:2999,days:15,rate:89,docs:['passport','photo','insurance','hotel','flight','bank','itr','noc']}]},\n    {code:'GBR',name:'United Kingdom',region:'Europe',shot:'London terrace houses, flat light',note:'Biometrics are done at a VFS centre. We book the slot nearest you the moment you pay.',visas:[\n      {id:'ukvis',name:'Standard Visitor',tag:'6 months, multiple entry',gov:11200,service:2999,days:12,rate:88,docs:['passport','photo','bank','itr','noc','hotel','flight']}]},\n    {code:'USA',name:'United States',region:'Americas',shot:'Desert highway, washed-out sky',note:'Interview slots, not paperwork, are the bottleneck. We watch for cancellations and rebook you earlier for free.',visas:[\n      {id:'usb2',name:'B1/B2 Visitor',tag:'10 years, multiple entry',gov:15800,service:3499,days:30,rate:82,docs:['passport','photo','ds160','bank','itr','noc','itinerary']}]},\n    {code:'MYS',name:'Malaysia',region:'South-East Asia',shot:'Penang shophouse facades',note:'Print the approval letter. Malaysian immigration still asks for paper at some counters.',visas:[\n      {id:'my30',name:'e-Visa',tag:'30 days, single entry',gov:1600,service:899,days:2,rate:99,docs:['passport','photo','flight','hotel']}]}\n  ];\n  FILEDROP = [\n    { name:'IMG_4821.HEIC', doc:'photo' },\n    { name:'axis-statement-jun-aug.pdf', doc:'bank' },\n    { name:'eticket_6E1432.pdf', doc:'flight' },\n    { name:'booking-confir
